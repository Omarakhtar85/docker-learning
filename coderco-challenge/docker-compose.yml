version: '3.8'

services:
 web:
 build:
 expose:
 ports:
 - "5002"
depends_on:
  - redis
enviornment:
  -REDIS_HOST=redis
  -REDIS_PORT=6379
redis:
  image: "redis:latest"
  ports:
  -"6379:6379"
  volumes:
  - redis-data:/data

  volumes:
   redis-data:

  nginx:
    image: nginx:latest
    ports:
    - "5002:5002"
    volumes:
    - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - web

  volumes: